<table class="table table-hover">
    <thead class="table-dark">
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nom</th>
            <th scope="col">Description</th>
            <th scope="col">Prix</th>
            <th scope="col">Action</th>
        </tr>
    </thead>
    <tbody>
        @for (product of products; track product.id; let i=$index) {
        <tr>
            <th scope="row">{{product.id}}</th>
            <td>{{product.name}}</td>
            <td>{{product.description}}</td>
            <!-- <td [style.color]="product.prix >20? 'red':'green'"
                [style.font-weight]="product.prix >20? 'bold':'normal'"
                >{{product.prix}} £</td> -->
            <!-- <td [class]="product.prix >20? 'high-price': 'low-price'">{{product.prix}} £</td> -->
             <td [style]="getPriceStyle(product.price)">{{product.price}} £</td>
            <td class="btn-actions">
                <button type="button" class="btn btn-primary" (click)="goToProductDetails(product.id)">Voir Détails</button>
                <button type="button" class="btn btn-success" (click)="goToEditProduct(product.id)">Modifier</button>
                <button type="button" class="btn btn-danger" (click)="deleteProduct(product.id)">Supprimer</button>
            </td>
        </tr>
        }
        @empty {
            <tr>
                <td colspan="5">Aucun produit disponible</td>
            </tr>
        }
        <!-- @if(products.length===0){
             <tr>
                <td colspan="5">Aucun produit disponible</td>
            </tr>
        } @else {
             <tr>
                <td colspan="5">Afficher les produits</td>
            </tr>
        } -->
    </tbody>
</table>
